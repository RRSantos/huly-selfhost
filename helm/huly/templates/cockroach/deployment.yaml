{{- if .Values.cockroach.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cockroach
  labels:
    {{- include "huly.labels" . | nindent 4 }}
    app: cockroach
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cockroach
  template:
    metadata:
      labels:
        {{- include "huly.labels" . | nindent 8 }}
        app: cockroach
    spec:
      {{- include "huly.scheduling" . | nindent 6 }}
      {{- if .Values.cockroach.certs.enabled }}
      initContainers:
        - name: generate-cockroach-certs
          image: "{{ .Values.cockroach.image }}"
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          command:
            - /bin/sh
            - -ec
            - |
              CERTS_DIR="/cockroach/certs"

              SERVICE_NAME="cockroach"
              NAMESPACE="${POD_NAMESPACE}"

              SERVICE_FQDN="${SERVICE_NAME}.${NAMESPACE}.svc.cluster.local"

              echo "Checking CockroachDB certificates..."

              if [ -f "${CERTS_DIR}/ca.crt" ] &&
                [ -f "${CERTS_DIR}/node.crt" ] &&
                [ -f "${CERTS_DIR}/node.key" ]; then
                echo "Certificates already exist. Nothing to do."
                exit 0
              fi

              echo "Generating CockroachDB CA..."

              cockroach cert create-ca \
                --certs-dir="${CERTS_DIR}" \
                --ca-key="${CERTS_DIR}/ca.key"

              echo "Generating CockroachDB node certificate..."

              cockroach cert create-node \
                localhost \
                127.0.0.1 \
                "${SERVICE_NAME}" \
                "${SERVICE_NAME}.${NAMESPACE}" \
                "${SERVICE_NAME}.${NAMESPACE}.svc" \
                "${SERVICE_FQDN}" \
                --certs-dir="${CERTS_DIR}" \
                --ca-key="${CERTS_DIR}/ca.key"

              echo "Certificates generated successfully."

              # The CA private key is only needed to generate certificates.
              # rm -f "${CERTS_DIR}/ca.key"

              chmod 600 "${CERTS_DIR}/node.key"
              chmod 644 "${CERTS_DIR}/ca.crt" "${CERTS_DIR}/node.crt"

          volumeMounts:
            - name: certs
              mountPath: /cockroach/certs
      {{- end }}
      containers:
        - name: cockroach
          image: "{{ .Values.cockroach.image }}"
          args:
            {{- toYaml .Values.cockroach.container.args | nindent 12 }}
          ports:
            - name: grpc
              containerPort: 26257
            - name: http
              containerPort: 8080
          env:
            - name: COCKROACH_DATABASE
              value: {{ .Values.cockroach.database }}
            - name: COCKROACH_USER
              value: {{ .Values.cockroach.username }}
            # {{- include "huly.envSecret" (dict "name" "COCKROACH_PASSWORD" "key" "COCKROACH_PASSWORD" "root" .) | nindent 12 }}
          readinessProbe:
            exec:
              command: ['sh', '-c', 'curl -sf http://localhost:8080/health?ready=1']
            initialDelaySeconds: 10
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /health
              port: 8080
              scheme: HTTP
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /cockroach/cockroach-data
            - name: certs
              mountPath: /cockroach/certs
          {{- with .Values.cockroach.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cockroach-data
        - name: certs
          persistentVolumeClaim:
            claimName: cockroach-certs
{{- end }}
